[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-driver-kitti"
version = "1.0.0"
description = "Windows-ready KITTI 2D detection, ByteTrack tracking and ONNX export"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

